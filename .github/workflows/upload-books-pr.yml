name: Validate book upload PR

# Contributors add PDFs on a topic branch and open a pull request **into** `upload-books`.
# Maintainers review here, then merge `upload-books` ? `main` when ready.

on:
  pull_request:
    branches:
      - upload-books
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: upload-books-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch merge base
        run: git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.sha }}

      - name: Validate changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No file changes in this pull request."
            exit 1
          fi

          max_bytes=$((95 * 1024 * 1024))

          for f in "${files[@]}"; do
            if [[ "$f" == .github/* ]]; then
              echo "::error::Book upload PRs must not change workflow or GitHub metadata. File: $f"
              exit 1
            fi

            if [[ "$f" != *.pdf ]]; then
              echo "::error::Only PDF files may change in a book upload PR. Found: $f"
              exit 1
            fi

            case "$f" in
              "For Dummies/"*|OReilly/*) ;;
              *)
                echo "::error::PDFs must be under For Dummies/ or OReilly/ (see README). Found: $f"
                exit 1
                ;;
            esac

            if git cat-file -e "$HEAD_SHA:$f" 2>/dev/null; then
              size=$(git cat-file -s "$HEAD_SHA:$f")
              if [ "$size" -gt "$max_bytes" ]; then
                echo "::error::File exceeds 95 MiB (keep under GitHub's 100 MiB blob limit): $f ($size bytes)"
                exit 1
              fi
            fi
          done

          echo "OK: ${#files[@]} changed file(s) are PDFs under allowed paths and within size limits."
